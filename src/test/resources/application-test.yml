spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  main:
    allow-circular-references: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 25
    username: test@test.com
    password: testpass
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8085
  error:
    whitelabel:
      enabled: false

cors:
  allowed-origins: http://localhost:4200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

flickr:
  apiKey: testkey
  apiSecret: testsecret
  appKey: testappkey
  appSecret: testappsecret

jwt:
  secret: testSecretKeyForUnitTestsOnlyDoNotUseInProductionEnvironment1234567890

logging:
  level:
    root: INFO
    com.devtech.gestiondestock: INFO
