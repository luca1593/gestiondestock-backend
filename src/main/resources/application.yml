spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3307}/${DB_NAME:gestiondestock}?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  webmvc:
    cors:
      allowed-origins: "${CORS_ORIGINS:http://localhost:4200}"
  
  main:
    allow-circular-references: true

  jpa:
    database: MYSQL
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        ejb:
          interceptor: com.devtech.gestiondestock.interceptor.Interceptor
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    dispatch-options-request: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  error:
    whitelabel:
      enabled: false
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: ${SHOW_HEALTH_DETAILS:false}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}

flickr:
  apiKey: ${FLICKR_API_KEY}
  apiSecret: ${FLICKR_API_SECRET}
  appKey: ${FLICKR_APP_KEY}
  appSecret: ${FLICKR_APP_SECRET}

logging:
  level:
    root: INFO
    com.devtech.gestiondestock: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
