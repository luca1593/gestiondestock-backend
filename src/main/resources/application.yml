spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:12.24.5.100}:${DB_PORT:3306}/${DB_NAME:gestiondestock}?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
    username: ${DB_USERNAME:luca}
    password: ${DB_PASSWORD:luca1593}
    driver-class-name: com.mysql.cj.jdbc.Driver
  webmvc:
    cors:
      allowed-origins: "*"
  
  main:
    allow-circular-references: true

  jpa:
    database: MYSQL
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        ejb:
          interceptor: com.devtech.gestiondestock.interceptor.Interceptor
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    dispatch-options-request: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:gestion-stock@dev-tech.com}
    password: ${MAIL_PASSWORD:your_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  error:
    whitelabel:
      enabled: false
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

flickr:
  apiKey: ${FLICKR_API_KEY:abc11f1e268d908eeee176297269c001}
  apiSecret: ${FLICKR_API_SECRET:50a8ae15b4224302}
  appKey: ${FLICKR_APP_KEY:72157720855398857-f67e55f056acdd0d}
  appSecret: ${FLICKR_APP_SECRET:2ba345379070ffc8}

logging:
  level:
    root: INFO
    com.devtech.gestiondestock: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
