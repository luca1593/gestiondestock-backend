spring:
  webmvc:
    cors:
      allowed-origins: "http://www.gestion-stock.mg"
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    date-format: dd/MM/yyyy HH:mm:ss
    time-zone: UTC
  datasource:
    url: jdbc:mysql://${DB_HOST:12.24.5.100}:${DB_PORT:3306}/${DB_NAME:gestiondestock}?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
    username: ${DB_USERNAME:luca}
    password: ${DB_PASSWORD:luca1593}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database: MYSQL
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,env,beans
  endpoint:
    health:
      show-details: NEVER
      probes:
        enabled: true
  health:
    mail:
      enabled: false
  metrics:
    tags:
      env: prod

spring.boot.admin:
  client:
    url: ${SPRING_BOOT_ADMIN_URL:http://localhost:8084}
    instance:
      name: gestiondestock-prod

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    url: /v3/api-docs
server:
  port: 8080

logging:
  level:
    root: INFO
    com.devtech.gestiondestock: DEBUG
    com.devtech.gestiondestock.interceptor: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"