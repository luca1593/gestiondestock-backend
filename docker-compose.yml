services:
  mysql:
    image: mysql:8.0
    container_name: gestiondestock-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: gestiondestock
      MYSQL_USER: ${DB_USERNAME:-luca}
      MYSQL_PASSWORD: ${DB_PASSWORD:-luca1593}
    ports:
      - "3307:3307"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gestiondestock-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gestiondestock-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3307
      PMA_USER: ${DB_USERNAME:-luca}
      PMA_PASSWORD: ${DB_PASSWORD:-luca1593}
    ports:
      - "8081:82"
    depends_on:
      - mysql
    networks:
      - gestiondestock-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-latest}
        BUILD_VERSION: ${BUILD_VERSION:-latest}
      no_cache: true
    container_name: gestiondestock-backend
    restart: always
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8085
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3307}
      DB_NAME: ${DB_NAME:-gestiondestock}
      DB_USERNAME: ${DB_USERNAME:-luca}
      DB_PASSWORD: ${DB_PASSWORD:-luca1593}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-a3f8b2c7d1e9f4a5b6c8d2e7f3a9b1c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0}
      FLICKR_API_KEY: ${FLICKR_API_KEY:-abc11f1e268d908eeee176297269c001}
      FLICKR_API_SECRET: ${FLICKR_API_SECRET:-50a8ae15b4224302}
      FLICKR_APP_KEY: ${FLICKR_APP_KEY:-72157720855398857-f67e55f056acdd0d}
      FLICKR_APP_SECRET: ${FLICKR_APP_SECRET:-2ba345379070ffc8}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-mpiasaorange@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-JustMe12}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SHOW_HEALTH_DETAILS: ${SHOW_HEALTH_DETAILS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:8085}
    ports:
      - "8085:8085"
    depends_on:
      - mysql
    networks:
      - gestiondestock-network

volumes:
  mysql_data:

networks:
  gestiondestock-network:
    driver: bridge
