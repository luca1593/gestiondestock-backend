version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gestiondestock-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: gestiondestock
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3307"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gestiondestock-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gestiondestock-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3307
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:82"
    depends_on:
      - mysql
    networks:
      - gestiondestock-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-latest}
        BUILD_VERSION: ${BUILD_VERSION:-latest}
      no_cache: true
    container_name: gestiondestock-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SERVER_PORT: 8085
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: gestiondestock
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FLICKR_API_KEY: ${FLICKR_API_KEY}
      FLICKR_API_SECRET: ${FLICKR_API_SECRET}
      FLICKR_APP_KEY: ${FLICKR_APP_KEY}
      FLICKR_APP_SECRET: ${FLICKR_APP_SECRET}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SHOW_HEALTH_DETAILS: ${SHOW_HEALTH_DETAILS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:8085}
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gestiondestock-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mysql_data:

networks:
  gestiondestock-network:
    driver: bridge
