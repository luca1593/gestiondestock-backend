version: "3.9"

services:

  mysql:
    image: mysql:lts
    container_name: gestiondestock-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: gestiondestock
      MYSQL_USER: ${DB_USERNAME:-luca}
      MYSQL_PASSWORD: ${DB_PASSWORD:-luca1593}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gestiondestock-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gestiondestock-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-luca}
      PMA_PASSWORD: ${DB_PASSWORD:-luca1593}
    ports:
      - "8087:80"
    depends_on:
      - mysql
    networks:
      - gestiondestock-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-latest}
        BUILD_VERSION: ${BUILD_VERSION:-latest}
    container_name: gestiondestock-backend
    restart: always
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8085
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-gestiondestock}
      DB_USERNAME: ${DB_USERNAME:-luca}
      DB_PASSWORD: ${DB_PASSWORD:-luca1593}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-a3f8b2c7d1e9f4a5b6c8d2e7f3a9b1c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-mpiasaorange@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-JustMe12}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SHOW_HEALTH_DETAILS: ${SHOW_HEALTH_DETAILS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:8085}
      SPRING_BOOT_ADMIN_URL: ${SPRING_BOOT_ADMIN_URL:-http://spring-boot-admin:8084}
    ports:
      - "8085:8085"
    networks:
      - gestiondestock-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  spring-boot-admin:
    image: codecentric/spring-boot-admin:3.1.0
    container_name: spring-boot-admin
    restart: always
    ports:
      - "8084:8084"
    environment:
      SPRING_BOOT_ADMIN_AUTH_USERNAME: admin
      SPRING_BOOT_ADMIN_AUTH_PASSWORD: admin123
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: admin123
    networks:
      - gestiondestock-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - gestiondestock-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - gestiondestock-network
    depends_on:
      - prometheus

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:

networks:
  gestiondestock-network:
    driver: bridge