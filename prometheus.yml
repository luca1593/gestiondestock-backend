global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gestiondestock-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8085']
        labels:
          application: 'gestiondestock'

  - job_name: 'spring-boot-admin'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['spring-boot-admin:8084']
        labels:
          application: 'spring-boot-admin'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
