services:
  mysql:
    image: mysql:lts
    container_name: gestiondestock-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-luca1593}
      MYSQL_DATABASE: gestiondestock
      MYSQL_USER: ${DB_USERNAME:-luca}
      MYSQL_PASSWORD: ${DB_PASSWORD:-luca1593}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gestiondestock-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-luca}
      PMA_PASSWORD: ${DB_PASSWORD:-luca1593}
      UPLOAD_LIMIT: 50M
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        BUILD_DATE: ${BUILD_DATE:-latest}
        BUILD_VERSION: ${BUILD_VERSION:-latest}
    container_name: gestiondestock-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3307
      DB_NAME: ${DB_NAME:-gestiondestock}
      DB_USERNAME: ${DB_USERNAME:-luca}
      DB_PASSWORD: ${DB_PASSWORD:-luca1593}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-a3f8b2c7d1e9f4a5b6c8d2e7f3a9b1c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-mpiasaorange@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-JustMe12}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SHOW_HEALTH_DETAILS: ${SHOW_HEALTH_DETAILS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:8085}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: true
      SERVER_PORT: 8080
    ports:
      - "8085:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-network
      - frontend-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  nginx:
    image: nginx:alpine
    container_name: gestiondestock-nginx
    restart: always
    ports:
      - "93:93"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - frontend-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: gestiondestock-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: 86400
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_NOTIFICATIONS: "shoutrrr"
      WATCHTOWER_NOTIFICATION_URL: ${WATCHTOWER_NOTIFICATION_URL:-}
    command: --interval 86400 --cleanup
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  mysql_data:
    name: db_gstk

networks:
  backend-network:
    driver: bridge

  frontend-network:
    driver: bridge
